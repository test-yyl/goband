name = "goband"
main = "src/index.js"  # 根据你的实际入口文件修改
compatibility_date = "2025-03-01"

# 添加兼容性标志
compatibility_flags = ["sqlite_durable_objects"]

# Durable Objects 绑定
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"
storage_backend = "sqlite"

# 迁移配置
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
